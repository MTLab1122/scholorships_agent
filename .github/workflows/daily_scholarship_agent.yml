name: Daily Scholarship Intelligence Pipeline

on:
  schedule:
    # 07:00 PKT (Pakistan Standard Time, UTC+5) is 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      dry_run:
        description: 'Run with mock extraction (no Gemini API calls)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-daily-scholarships:
    name: Crawl, Verify, Generate Reports & Deliver
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Scholarship Intelligence Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          FORWARD_EMAIL: ${{ secrets.FORWARD_EMAIL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py run --dry-run
          else
            python main.py run
          fi

      - name: Commit Updated Data & Reports to Git Repository
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Scholarship Intelligence Agent"
          git add data/ reports/
          if git diff --staged --quiet; then
            echo "No new reports or state changes to commit."
          else
            git commit -m "Auto: Update daily scholarship intelligence reports and state [skip ci]"
            git push
          fi

      - name: Upload Daily Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-scholarship-reports-${{ github.run_id }}
          path: reports/
          retention-days: 60
