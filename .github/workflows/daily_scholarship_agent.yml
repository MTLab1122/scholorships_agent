name: Daily Scholarship Intelligence Pipeline

on:
  schedule:
    # 01:45 UTC is 06:45 AM PKT (UTC+5).
    # Triggers 15 minutes early so Agents 1–9 process discoveries, verify sources, and monitor
    # deadlines in advance. The 07:00:00 AM PKT gate then holds dispatch until exact 07:00:00 AM PKT.
    - cron: '45 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      dry_run:
        description: 'Run with mock extraction (no Gemini API calls)'
        required: false
        default: false
        type: boolean
      no_wait:
        description: 'Bypass 07:00 AM PKT wait gate (instant execution for testing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-daily-scholarships:
    name: Crawl, Verify, Generate Reports & Deliver
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Scholarship Intelligence Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'onboarding@resend.dev' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL || 'muhammadtalhapro1@gmail.com' }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || 'muhammadtalhapro1@gmail.com' }}
          EMAIL_ATTACHMENT_FORMATS: ${{ secrets.EMAIL_ATTACHMENT_FORMATS || 'pdf' }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ "${{ inputs.no_wait }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-wait"
          fi
          python main.py run $EXTRA_ARGS

      - name: Commit Updated Data & Reports to Git Repository
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Scholarship Intelligence Agent"
          git add data/opportunities.db data/scholarships.json reports/
          if git diff --staged --quiet; then
            echo "No new reports or state changes to commit."
          else
            git commit -m "Auto: Update daily scholarship intelligence reports and state [skip ci]"
            git push
          fi

      - name: Upload Daily Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-scholarship-reports-${{ github.run_id }}
          path: reports/
          retention-days: 60
